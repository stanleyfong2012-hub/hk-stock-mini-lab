<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f4">
    <meta name="description" content="在瀏覽器中清理文字並計算單字數量。">
    <title>文字清理與單字計數</title>
    <link rel="stylesheet" href="./text-tool.css">
    <script src="./text-tool.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">TEXT TOOL · 01</p>
        <h1>文字清理<span>與單字計數</span></h1>
        <p class="description">移除頭尾空白、合併換行並轉為小寫。文字只會在你的瀏覽器中處理。</p>
      </header>

      <section class="workspace" aria-label="文字清理工具">
        <div class="section-heading">
          <label for="source-text">輸入文字</label>
          <span>貼上內容，或選擇 .txt 檔案</span>
        </div>
        <textarea id="source-text" placeholder="在此輸入或貼上文字…" spellcheck="false"></textarea>

        <div class="actions">
          <label class="file-button" for="text-file">選擇文字檔</label>
          <input id="text-file" type="file" accept=".txt,text/plain" hidden>
          <button class="primary-button" id="clean-button" type="button">清理文字</button>
        </div>

        <div class="result-heading">
          <div>
            <p class="eyebrow">RESULT</p>
            <h2>清理後的文字</h2>
          </div>
          <p class="word-count" aria-live="polite"><strong id="word-count">0</strong> 個單字</p>
        </div>
        <pre id="cleaned-text" class="result" aria-live="polite">清理後的文字會顯示在這裡。</pre>
        <div class="result-actions">
          <p id="status" role="status" aria-live="polite"></p>
          <button id="copy-button" class="copy-button" type="button" disabled>複製結果</button>
        </div>
      </section>

      <footer>學習用途 · 內容不會上傳或離開你的裝置</footer>
    </main>
  </body>
</html>
